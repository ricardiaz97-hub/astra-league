 <rect x="1145" y="325" width="90" height="260" rx="8" fill="#72685d" stroke="#1d1a22" stroke-width="4"/><path d="M1160 340H1220V570H1160Z" fill="#bea991" stroke="#f3ece2" stroke-width="3" stroke-dasharray="8 6"/>
