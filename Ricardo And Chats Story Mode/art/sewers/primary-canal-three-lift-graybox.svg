<rect x="70" y="865" width="460" height="180" rx="16" fill="#fffaf3" stroke="#1d1a22" stroke-width="3"/><rect x="570" y="865" width="460" height="180" rx="16" fill="#fffaf3" stroke="#1d1a22" stroke-width="3"/><rect x="1070" y="865" width="460" height="180" rx="16" fill="#fffaf3" stroke="#1d1a22" stroke-width="3"/>
<text x="95" y="905" class="label">1 · FIRST LIFT</text><text x="95" y="940" class="small">Pump noise draws a small fast swarm</text><text x="95" y="964" class="small">from a side culvert. Lift locks; cross.</text><text x="95" y="1015" class="small">Teach the mechanic safely.</text>
<text x="595" y="905" class="label">2 · SECOND LIFT</text><text x="595" y="940" class="small">Longer hold. Bugs drop from pipework</text><text x="595" y="964" class="small">and enter from the opposite bank.</text><text x="595" y="1015" class="small">Use the new raised crossing.</text>
<text x="1095" y="905" class="label">3 · FINAL LIFT</text><text x="1095" y="940" class="small">Largest swarm: mixed bugs plus one</text><text x="1095" y="964" class="small">heavy unit. Canal creature stirs, then vanishes.</text><text x="1095" y="1015" class="small">Final platform locks; route to rusted zone.</text>
</svg>
