<path d="M120 935H1480" stroke="#1d1a22" stroke-width="5"/>
<!-- water plane -->
<path d="M130 910H590V935H130Z" fill="#4c6265"/><path d="M135 918q20-8 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="#a5c1bd" stroke-width="3"/>
<!-- walkway ramp/platform -->
<path d="M150 910H410V865H560V820H975V860H1120V810H1455" fill="none" stroke="#766b60" stroke-width="22" stroke-linejoin="round"/>
<path d="M150 910H410V865H560V820H975V860H1120V810H1455" fill="none" stroke="#d7c9b7" stroke-width="14" stroke-linejoin="round"/>
<!-- obstacle pipe and gap bridged -->
<circle cx="305" cy="887" r="28" fill="#6c6258" stroke="#1d1a22" stroke-width="4"/>
<path d="M690 820l52-55 54 55" fill="none" stroke="#e85d04" stroke-width="5" stroke-dasharray="8 6"/>
<path d="M1020 860l50-60 52 10" fill="none" stroke="#e85d04" stroke-width="5" stroke-dasharray="8 6"/>
<!-- numbered movement beat labels -->
<g><circle cx="190" cy="790" r="18" fill="#e85d04"/><text x="184" y="797" class="num">1</text><text x="220" y="796" class="small">descend ladder / step into water</text>
<circle cx="380" cy="790" r="18" fill="#e85d04"/><text x="374" y="797" class="num">2</text><text x="410" y="796" class="small">vault low pipe</text>
<circle cx="625" cy="790" r="18" fill="#e85d04"/><text x="619" y="797" class="num">3</text><text x="655" y="796" class="small">climb onto dry ledge</text>
<circle cx="945" cy="790" r="18" fill="#e85d04"/><text x="939" y="797" class="num">4</text><text x="975" y="796" class="small">short gap hop</text>
<circle cx="1260" cy="790" r="18" fill="#e85d04"/><text x="1254" y="797" class="num">5</text><text x="1290" y="796" class="small">canal opens ahead</text></g>
<text x="100" y="990" class="small">No enemies, combat, hazards, or time pressure in this section. Teach movement safely, then reveal the canal and transition into the next zone.</text>
</svg>
