<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e85d04"/></marker>
  <pattern id="water" width="42" height="26" patternUnits="userSpaceOnUse"><rect width="42" height="26" fill="#33434a"/><path d="M3 9q7-4 14 0t14 0M-8 21q7-4 14 0t14 0" fill="none" stroke="#8aa5a5" stroke-width="2" opacity=".55"/></pattern>
  <pattern id="concrete" width="48" height="40" patternUnits="userSpaceOnUse"><rect width="48" height="40" fill="#d6c9b6"/><path d="M0 20H48M24 0V20M8 20V40" stroke="#b4a797" stroke-width="1" opacity=".5"/></pattern>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;fill:#1d1a22}.title{font-size:38px;font-weight:900;letter-spacing:2px}.sub{font-size:18px;fill:#5c5651}.label{font-size:19px;font-weight:800}.small{font-size:15px;fill:#504a45}.num{font-size:18px;font-weight:900;fill:#fff}
  </style>
</defs>
<rect width="1600" height="1100" fill="#f3ece2"/>
<path d="M0 0H1600V18H0Z" fill="#e85d04"/>
<text x="70" y="78" class="title">SEWER LEVEL — SECTION 01</text>
<text x="72" y="111" class="sub">ENTRY TO PRIMARY CANAL · CALM MOVEMENT TUTORIAL · NO ENEMIES</text>
<rect x="70" y="145" width="1460" height="490" rx="18" fill="#eee4d6" stroke="#1d1a22" stroke-width="4"/>
<text x="94" y="180" class="label">TOP-DOWN GRAYBOX</text>
<text x="1250" y="180" class="small">ONE CLEAR FORWARD ROUTE →</text>
