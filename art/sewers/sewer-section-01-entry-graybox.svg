<path d="M255 462C345 468 390 320 475 320S610 324 688 340S815 325 895 325S965 325 1000 325S1175 325 1300 325" fill="none" stroke="#e85d04" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 1" marker-end="url(#arrow)"/>
<!-- route markers -->
<g><circle cx="340" cy="447" r="19" fill="#e85d04"/><text x="334" y="454" class="num">1</text><circle cx="530" cy="320" r="19" fill="#e85d04"/><text x="524" y="327" class="num">2</text><circle cx="730" cy="339" r="19" fill="#e85d04"/><text x="724" y="346" class="num">3</text><circle cx="1072" cy="325" r="19" fill="#e85d04"/><text x="1066" y="332" class="num">4</text><circle cx="1325" cy="325" r="19" fill="#e85d04"/><text x="1319" y="332" class="num">5</text></g>
<!-- scale water note -->
<text x="170" y="510" class="small">ANKLE-DEEP WATER</text>
<text x="105" y="614" class="small">Main path is visible throughout; no maze branches. Optional shortcut rejoins immediately.</text>
<!-- side elevation panel -->
<rect x="70" y="665" width="1460" height="360" rx="18" fill="#f7f1e8" stroke="#1d1a22" stroke-width="4"/>
