<path d="M390 285H1435V365H390Z" fill="#c7b7a2" stroke="#514b49" stroke-width="4"/>
<path d="M410 298H1405V351H410Z" fill="#ded2c2" stroke="#8e8171" stroke-width="2" stroke-dasharray="8 7"/>
