<path d="M1405 230v132m0 0q0-115 60-132v300q-60-20-60-168" fill="#1d1a22" opacity=".95"/>
<path d="M1430 247q0-66 46-88q46 22 46 88v288q-40-14-46-70q-6 56-46 70z" fill="#26343a" stroke="#1d1a22" stroke-width="4"/>
