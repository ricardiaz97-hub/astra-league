<rect x="555" y="418" width="82" height="46" rx="6" fill="#8e8171" stroke="#1d1a22" stroke-width="3"/>
<rect x="667" y="465" width="88" height="43" rx="6" fill="#8e8171" stroke="#1d1a22" stroke-width="3"/>
<rect x="790" y="410" width="80" height="44" rx="6" fill="#8e8171" stroke="#1d1a22" stroke-width="3"/>
<text x="548" y="527" class="small">OPTIONAL WATER SHORTCUT</text><text x="548" y="548" class="small">stepping blocks; rejoins main path</text>
