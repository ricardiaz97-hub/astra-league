<circle cx="230" cy="282" r="55" fill="#f7cf91" stroke="#1d1a22" stroke-width="7"/>
<path d="M198 276h64M198 291h64M218 249v65M242 249v65" stroke="#5a5047" stroke-width="5"/>
<text x="164" y="352" class="label">MANHOLE ENTRY</text><text x="164" y="388" class="small">Ladder down; daylight</text><text x="164" y="411" class="small">falls behind the squad.</text>
