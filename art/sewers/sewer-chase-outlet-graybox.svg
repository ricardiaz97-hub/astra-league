<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<defs>
 <pattern id="water" width="48" height="28" patternUnits="userSpaceOnUse"><rect width="48" height="28" fill="#33434a"/><path d="M0 9q10-5 20 0t20 0M-12 24q10-5 20 0t20 0" fill="none" stroke="#8aa5a5" stroke-width="2" opacity=".5"/></pattern>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#e85d04"/></marker>
 <style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d1a22}.title{font-size:38px;font-weight:900;letter-spacing:2px}.sub{font-size:18px;fill:#5c5651}.label{font-size:19px;font-weight:800}.small{font-size:15px;fill:#514b49}.num{font-size:18px;font-weight:900;fill:#fff}</style>
</defs>
<rect width="1600" height="1050" fill="#f3ece2"/><path d="M0 0H1600V18H0Z" fill="#e85d04"/>
<text x="70" y="76" class="title">SEWER CHASE — RUN TO THE OUTLET</text>
<text x="72" y="110" class="sub">ONE-WAY ESCAPE · NO COMBAT DETOURS · THE BEAST IS ALWAYS BEHIND</text>
<rect x="65" y="140" width="1470" height="545" rx="18" fill="#eee4d6" stroke="#1d1a22" stroke-width="4"/>
<text x="90" y="179" class="label">TOP-DOWN GRAYBOX</text>
<!-- tunnel & canal -->
<rect x="100" y="205" width="1400" height="425" rx="16" fill="#d4c6b3" stroke="#72685d" stroke-width="4"/>
<rect x="130" y="305" width="1340" height="245" fill="url(#water)" stroke="#26343a" stroke-width="4"/>
<path d="M130 205H1470V305H130ZM130 550H1470V630H130Z" fill="#c9b99f" stroke="#766b60" stroke-width="3"/>
<text x="510" y="436" class="label" fill="#f3ece2">PRIMARY CANAL — FALLEN WALKWAY</text>
<text x="126" y="289" class="small">NORTH BANK</text><text x="126" y="582" class="small">SOUTH BANK</text>
<!-- beast start -->
<path d="M155 415q-20-38 12-60l13-35 21 30 30-8-16 29q24 32-1 52l-19-15-18 15z" fill="#1d1a22"/><circle cx="177" cy="374" r="5" fill="#e85d04"/><circle cx="193" cy="374" r="5" fill="#e85d04"/>
<text x="105" y="483" class="small">BEAST CRASHES THROUGH</text><text x="105" y="503" class="small">THIRD LIFT BEHIND TEAM</text>
<!-- start, route ledges -->
<circle cx="300" cy="260" r="20" fill="#e85d04"/><text x="294" y="267" class="num">0</text><text x="265" y="230" class="small">RUN TRIGGER</text>
<path d="M315 257H650" stroke="#e85d04" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
<!-- broken walkway -->
<path d="M310 255H720" stroke="#766b60" stroke-width="23" stroke-linecap="round"/><path d="M310 255H720" stroke="#d8cbb9" stroke-width="15" stroke-linecap="round"/>
<path d="M720 244l38 22 34-28 37 18" fill="none" stroke="#766b60" stroke-width="17" stroke-dasharray="12 12"/>
<!-- wall run along north side -->
<path d="M805 255Q875 225 948 255" fill="none" stroke="#e85d04" stroke-width="10" stroke-dasharray="12 8" marker-end="url(#arrow)"/>
<rect x="810" y="205" width="150" height="33" rx="8" fill="#776d62" stroke="#1d1a22" stroke-width="3"/><text x="806" y="198" class="small">WALL-RUN SURFACE</text>
<!-- jump gap to opposite bank -->
<path d="M970 255Q1040 305 1080 365" fill="none" stroke="#e85d04" stroke-width="9" stroke-dasharray="13 9" marker-end="url(#arrow)"/>
<path d="M1080 366v-49h160v49" fill="#d0c2af" stroke="#1d1a22" stroke-width="4"/><text x="1057" y="395" class="small">WALL-JUMP TO SOUTH BANK</text>
<!-- final sprint and ladder -->
<path d="M1240 365H1400" stroke="#e85d04" stroke-width="9" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1370" y="320" width="82" height="82" rx="8" fill="#8d8173" stroke="#1d1a22" stroke-width="4"/><path d="M1380 331h62M1380 349h62M1380 367h62M1380 385h62" stroke="#f3ece2" stroke-width="4"/>
<circle cx="1453" cy="358" r="33" fill="#f6c779" stroke="#1d1a22" stroke-width="5"/><path d="M1435 358h36m-18-18v36" stroke="#1d1a22" stroke-width="4"/>
<text x="1338" y="430" class="label">OUTLET</text><text x="1300" y="451" class="small">3 blocks from Hotel Aurora</text>
<!-- sequence numbers -->
<g><circle cx="500" cy="255" r="20" fill="#e85d04"/><text x="494" y="262" class="num">1</text><circle cx="727" cy="280" r="20" fill="#e85d04"/><text x="721" y="287" class="num">2</text><circle cx="885" cy="264" r="20" fill="#e85d04"/><text x="879" y="271" class="num">3</text><circle cx="1033" cy="318" r="20" fill="#e85d04"/><text x="1027" y="325" class="num">4</text><circle cx="1320" cy="365" r="20" fill="#e85d04"/><text x="1314" y="372" class="num">5</text></g>
<!-- lower elevation -->
<rect x="65" y="715" width="1470" height="280" rx="18" fill="#fffaf3" stroke="#1d1a22" stroke-width="4"/>
<text x="92" y="755" class="label">SIDE ELEVATION — OBSTACLES IN ORDER</text>
<path d="M100 930H1500" stroke="#26343a" stroke-width="7"/>
<path d="M120 895H470l75 18h100l60-30h160l48-70 70 70h195l62-90h84v107h130" fill="none" stroke="#766b60" stroke-width="27" stroke-linejoin="round"/>
<path d="M120 895H470l75 18h100l60-30h160l48-70 70 70h195l62-90h84v107h130" fill="none" stroke="#d8cbb9" stroke-width="17" stroke-linejoin="round"/>
<!-- snapped floor and pipe -->
<path d="M520 908l34 13 28-18 30 17" fill="none" stroke="#e85d04" stroke-width="7" stroke-dasharray="8 6"/><circle cx="360" cy="880" r="25" fill="#70655b" stroke="#1d1a22" stroke-width="3"/>
<!-- wall run and jump guide -->
<path d="M760 872Q830 788 900 872" fill="none" stroke="#e85d04" stroke-width="6" stroke-dasharray="10 7" marker-end="url(#arrow)"/><path d="M1030 872Q1095 785 1160 872" fill="none" stroke="#e85d04" stroke-width="6" stroke-dasharray="10 7" marker-end="url(#arrow)"/>
<!-- callouts -->
<text x="150" y="820" class="small">SPRINT</text><text x="310" y="820" class="small">VAULT LOW PIPE</text><text x="520" y="820" class="small">FLOOR BREAKS</text><text x="760" y="790" class="small">WALL-RUN</text><text x="1030" y="790" class="small">WALL-JUMP</text><text x="1300" y="820" class="small">CLIMB LADDER</text>
<text x="95" y="972" class="small">Use environmental collapse and sound for pressure. Keep the route legible, the outlet visible as a warm landmark, and failure recoverable with a nearby checkpoint.</text>
</svg>
